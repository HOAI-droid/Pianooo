# Builds the Android app (phones and tablets, Android 7 and newer).
#
# Every push: build check + the APK as a run artifact.
# Push to main: additionally published as the GitHub Release "android-latest",
# so the download link never changes:
#   https://github.com/HOAI-droid/Pianooo/releases/download/android-latest/Pianooo.apk
#
# Signed with the key from the repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEY_PASSWORD, so every new APK installs over the previous one. Without
# them the APK gets a temporary debug key (each build then needs a fresh
# install). Installation: SIDELOADING.md.
name: Android

on:
  push:
    paths-ignore: ['**.md', 'site/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Catalog folders have umlauts and stars in their names
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build web part and sync into the Android project
        run: |
          npm run ipad:build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (from the repository secret, if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pianooo.jks"
            echo "PIANOOO_KEYSTORE=$RUNNER_TEMP/pianooo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 not set - the APK is signed with a temporary debug key"
          fi

      - name: Build Android app (APK)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_TOOL_OPTIONS: -Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8
          PIANOOO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pianooo.apk
          ls -la Pianooo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pianooo-Android
          path: Pianooo.apk
          retention-days: 30

      - name: Publish release "android-latest" (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest Pianooo.apk \
            --target "${GITHUB_SHA}" \
            --title "Pianooo für Android (aktueller Stand)" \
            --notes "Automatisch gebaut aus main (${GITHUB_SHA::7}, Build ${{ github.run_number }}). Pianooo.apk für Android-Tablets und -Handys ab Android 7. Installation siehe SIDELOADING.md." \
            --latest=false
