# Builds Pianooo on a Mac: the iPad app and the Mac app (Mac Catalyst — the
# same app in a Mac window).
#
# Every push: build check + both apps as run artifacts.
# Push to main: additionally published as the GitHub Release "ipad-latest", so
# the download links never change:
#   https://github.com/HOAI-droid/Pianooo/releases/download/ipad-latest/Pianooo.ipa
#   https://github.com/HOAI-droid/Pianooo/releases/download/ipad-latest/Pianooo-Mac.zip
#
# Both are unsigned (no Apple developer account). Installation: SIDELOADING.md.
name: iPad

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web part and sync into Xcode project
        run: npm run ipad:sync

      - name: Build iPad app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          # A failed build can leave a half-made .app behind — insist on a real one
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/Pianooo.app/Pianooo

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -80 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pianooo.app Payload/
          zip -qry Pianooo.ipa Payload
          ls -lh Pianooo.ipa

      # The Mac app must not hold up the iPad app: if it fails, the iPad
      # build is still published
      - name: Build Mac app (Mac Catalyst via CocoaPods, ad-hoc signed)
        id: mac
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-mac.sh

      - name: Show Mac compiler errors
        if: steps.mac.outcome == 'failure'
        run: grep -E "error:" -A3 xcodebuild-mac.log | head -80 || true

      - name: Package Mac app
        if: steps.mac.outcome == 'success'
        run: |
          cd build-mac/Build/Products/Release-maccatalyst
          codesign --verify --verbose Pianooo.app || true
          ditto -c -k --keepParent Pianooo.app "$GITHUB_WORKSPACE/Pianooo-Mac.zip"
          ls -lh "$GITHUB_WORKSPACE/Pianooo-Mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Pianooo-iPad-und-Mac
          path: |
            Pianooo.ipa
            Pianooo-Mac.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release "ipad-latest" (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipad-latest --yes --cleanup-tag 2>/dev/null || true
          files="Pianooo.ipa"; [ -f Pianooo-Mac.zip ] && files="$files Pianooo-Mac.zip"
          gh release create ipad-latest $files \
            --target "${GITHUB_SHA}" \
            --title "Pianooo für iPad und Mac (aktueller Stand)" \
            --notes "Automatisch gebaut aus main (${GITHUB_SHA::7}, Build ${{ github.run_number }}). Pianooo.ipa = iPad, Pianooo-Mac.zip = Mac. Unsigniert – Installation siehe SIDELOADING.md." \
            --latest
