# Builds the iPad app on a Mac and keeps an unsigned .ipa as a run artifact.
# Runs on every push and on demand (Actions → iPad → Run workflow).
#
# The .ipa is unsigned: install it with Sideloadly / AltStore (free Apple ID),
# or open ios/App/App.xcodeproj in Xcode and run it on your iPad directly.
name: iPad

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web part and sync into Xcode project
        run: npm run ipad:sync

      - name: Build iPad app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: .*Orfeo|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Pianooo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pianooo-iPad-unsigned
          path: Pianooo-unsigned.ipa
          retention-days: 30
